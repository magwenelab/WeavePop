$schema: "https://json-schema.org/draft/2020-12/schema"
## Source: https://github.com/snakemake-workflows
description: an entry in the metadata table (metadata.csv)
type: object
properties:
  sample:
    type: string
    description: sample name
  ref_genome:
    type: string
    description: ref_genome name
  strain:
    type: string
    description: strain name
required:
  - sample
  - ref_genome
  - strain